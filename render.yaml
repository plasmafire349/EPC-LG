services:
  - type: web
    name: epc-lg
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DATA_FILE_PATH
        value: /var/data/data.json
      # The following keys are marked as sync: false so they are NOT committed in plain text.
      # You will need to paste your actual keys into the Render dashboard manually.
      - key: TAVILY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_ENGINE_ID
        sync: false
      - key: SERPER_API_KEY
        sync: false
    disk:
      name: epc-lg-data
      mountPath: /var/data
      sizeGB: 1
